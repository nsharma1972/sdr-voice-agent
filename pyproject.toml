[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdr-voice-agent"
version = "0.1.0"
description = "Signal-triggered outbound voice AI for B2B sales development"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    # Voice pipeline (free stack)
    "pipecat-ai[daily,deepgram,silero,openai]>=0.0.50",
    "edge-tts>=6.1.12",                 # Microsoft Edge TTS — free, no key
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
